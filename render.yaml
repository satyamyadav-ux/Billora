services:
  - type: web
    name: billora
    runtime: docker
    plan: free
    region: ohio
    branch: main
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: billora-db
          property: connectionString

databases:
  - name: billora-db
    plan: free
    region: ohio
    databaseName: billora_db
    user: billora
