# ===================================================================
# BILLORA - Development Profile (H2 In-Memory Database)
# Enables local execution without external PostgreSQL requirement
# ===================================================================

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:billora_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: BilloraDevH2HikariCP
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.billora: DEBUG
    org.springframework.security: INFO

