spring:
  application:
    name: billora

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

billora:
  app:
    name: "Billora"
    tagline: "Subscription & Recurring Billing Management"
    version: "1.0.0-SNAPSHOT"
    currency: "USD"
    currency-symbol: "$"
