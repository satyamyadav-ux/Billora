<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Customers Directory')}">
    <title>Customers | Billora</title>
</head>
<body>
<div class="dashboard-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></aside>
    <div class="dashboard-main">
        <header th:replace="~{fragments/topbar :: topbar}"></header>

        <main class="dashboard-content">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="h3 fw-bold mb-1 text-dark">Customer Accounts</h1>
                    <p class="text-muted small mb-0">Subscriber accounts, billing contacts, payment methods, and lifecycle management.</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-primary btn-sm px-3 py-2 d-flex align-items-center gap-2">
                        <i class="bi bi-person-plus"></i>
                        <span>Add Customer</span>
                    </button>
                </div>
            </div>

            <div class="billora-card p-4 text-center py-5">
                <div class="stat-icon-wrapper stat-icon-blue mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                    <i class="bi bi-people"></i>
                </div>
                <h2 class="h5 fw-bold text-dark mb-2">Customer Management Module Ready</h2>
                <p class="text-muted small mx-auto mb-4" style="max-width: 440px;">
                    Structured for customer profiles, saved payment instruments, enterprise invoicing entities, and subscription history.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">Return to Overview</a>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
