<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/head :: head('Access Restricted')}">
    <title>Access Restricted | Billora</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-4" style="background-color: var(--color-offwhite);">
    <div class="billora-card p-5 text-center position-relative" style="max-width: 500px;">
        <div class="position-absolute top-0 start-0 end-0 rounded-top" style="height: 3px; background-color: var(--color-blue);"></div>
        <div class="stat-icon-wrapper mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.75rem; background: #F3F4F6; color: var(--color-black);">
            <i class="bi bi-shield-x"></i>
        </div>
        <span class="badge mb-3" style="background: #F3F4F6; color: var(--color-black); border: 1px solid var(--color-border);">403 RESTRICTED ACCESS</span>
        <h1 class="h4 fw-bold mb-2 text-dark">Insufficient Privileges</h1>
        <p class="text-muted mb-4 small">
            You do not have the required permissions to access this administrative resource.
        </p>

        <div class="p-3 bg-white rounded-2 text-start mb-4 border small">
            <div class="d-flex justify-content-between mb-1">
                <span class="text-muted">Signed In As:</span>
                <span class="fw-semibold text-dark" sec:authentication="name">User</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Active Role:</span>
                <span class="badge" style="background: #F3F4F6; color: #0B0B0B;" sec:authentication="principal.authorities">[ROLE_CUSTOMER]</span>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="bi bi-arrow-left me-1"></i> Dashboard
            </a>
            <a th:href="@{/logout}" class="btn btn-outline-secondary px-3">
                Sign Out
            </a>
        </div>
    </div>
</body>
</html>
