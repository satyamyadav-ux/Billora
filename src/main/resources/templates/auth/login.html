<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Sign In')}">
    <title>Sign In | Billora</title>
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5 col-xl-4">
                <!-- Brand Header -->
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-2">
                        <span class="brand-logo-mark">B</span>
                        <span class="fs-2 brand-font brand-text-gradient fw-bold">Billora</span>
                    </a>
                    <h1 class="h4 fw-bold text-dark mb-1">Welcome Back</h1>
                    <p class="text-muted small">Sign in to your subscription management console</p>
                </div>

                <!-- Alerts -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill flex-shrink-0 fs-5"></i>
                    <div th:text="${errorMessage}">Invalid email or password.</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${logoutMessage}" class="alert alert-info alert-dismissible fade show d-flex align-items-center gap-2 small" role="alert">
                    <i class="bi bi-info-circle-fill flex-shrink-0 fs-5"></i>
                    <div th:text="${logoutMessage}">You have been signed out.</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 small" role="alert">
                    <i class="bi bi-check-circle-fill flex-shrink-0 fs-5"></i>
                    <div th:text="${successMessage}">Registration successful!</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Login Card -->
                <div class="billora-card p-4 p-sm-5 shadow-sm mb-4">
                    <form th:action="@{/login}" method="post">
                        <!-- Email Field -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small text-dark">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="name@company.com" required autofocus>
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label fw-semibold small text-dark mb-0">Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePasswordBtn" title="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary-billora py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
                                <span>Sign In</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Quick Demo Credentials for Hackathon / Testing -->
                    <div class="mt-4 pt-3 border-top">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="text-muted small fw-semibold">Quick Test Accounts:</span>
                            <span class="badge bg-light text-muted border" style="font-size: 0.65rem;">Click to fill</span>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <button type="button" class="btn btn-sm btn-outline-danger py-1 px-2 rounded-2" onclick="fillCredentials('admin@billora.com', 'Admin@123')">
                                <i class="bi bi-shield-lock-fill me-1"></i>Admin
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2 rounded-2" onclick="fillCredentials('staff@billora.com', 'Staff@123')">
                                <i class="bi bi-person-badge me-1"></i>Staff
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-success py-1 px-2 rounded-2" onclick="fillCredentials('customer@billora.com', 'Customer@123')">
                                <i class="bi bi-person-check me-1"></i>Customer
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Footer Link -->
                <div class="text-center text-muted small">
                    Don't have an account yet? 
                    <a th:href="@{/register}" class="fw-bold text-primary text-decoration-none">Create a customer account</a>
                </div>
                <div class="text-center mt-3">
                    <a th:href="@{/}" class="text-muted small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Fragment -->
    <div th:replace="~{fragments/scripts :: scripts}"></div>
    <script>
        function fillCredentials(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePasswordBtn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
            });
        }
    </script>
</body>
</html>
