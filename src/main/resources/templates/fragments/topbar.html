<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="topbar" class="app-topbar">
    <!-- Left Section: Mobile Toggle & Minimal Search -->
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary d-lg-none p-1" id="sidebarToggleBtn" type="button" aria-label="Toggle navigation">
            <i class="bi bi-list fs-5"></i>
        </button>

        <div class="topbar-search d-none d-md-block">
            <i class="bi bi-search"></i>
            <input type="text" id="globalSearchInput" placeholder="Search subscriptions, customers, invoices..." autocomplete="off">
            <span class="topbar-kbd">⌘K</span>
        </div>
    </div>

    <!-- Right Section: Actions & User Info -->
    <div class="d-flex align-items-center gap-3">
        <!-- "+ Create" Quick Action (Blue Primary) -->
        <div class="dropdown">
            <button class="btn btn-primary btn-sm d-flex align-items-center gap-2 dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-plus-lg"></i>
                <span class="d-none d-sm-inline">Create</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm mt-2">
                <li><h6 class="dropdown-header text-muted small fw-semibold">Quick Create</h6></li>
                <li><a class="dropdown-item py-2" th:href="@{/dashboard/subscriptions}"><i class="bi bi-arrow-repeat me-2"></i>New Subscription</a></li>
                <li><a class="dropdown-item py-2" th:href="@{/dashboard/customers}"><i class="bi bi-person-plus me-2"></i>Add Customer</a></li>
                <li><a class="dropdown-item py-2" th:href="@{/dashboard/invoices}"><i class="bi bi-receipt me-2"></i>Generate Invoice</a></li>
            </ul>
        </div>

        <!-- Notification Bell with Yellow Notification Dot -->
        <div class="dropdown">
            <button class="btn btn-outline-secondary rounded-circle position-relative p-0 d-flex align-items-center justify-content-center" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 36px; height: 36px;">
                <i class="bi bi-bell text-dark"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-1 rounded-circle" style="background-color: var(--color-yellow); width: 8px; height: 8px; border: 1.5px solid var(--color-white);">
                    <span class="visually-hidden">New alerts</span>
                </span>
            </button>
            <div class="dropdown-menu dropdown-menu-end shadow-sm mt-2 p-0" style="width: 300px;">
                <div class="p-3 border-bottom d-flex align-items-center justify-content-between">
                    <span class="fw-semibold small text-dark">Notifications</span>
                    <span class="badge" style="background: var(--color-green-subtle); color: var(--color-green); border: 1px solid var(--color-green-border);">Live</span>
                </div>
                <div class="p-3 small text-muted">
                    <div class="d-flex align-items-start gap-2 mb-2">
                        <i class="bi bi-check-circle mt-1" style="color: var(--color-green);"></i>
                        <div>
                            <div class="text-dark fw-medium">Authentication Active</div>
                            <div class="text-muted" style="font-size: 0.75rem;">Role-based security enforced</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Name & Logout Area -->
        <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
            <div class="dropdown">
                <button class="btn btn-link p-0 text-decoration-none dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="user-avatar" th:text="${#authentication != null and #authentication.name != null ? #strings.substring(#authentication.name, 0, 1).toUpperCase() : 'U'}">U</div>
                    <div class="text-start d-none d-md-block">
                        <div class="fw-semibold text-dark lh-1" style="font-size: 0.85rem;" sec:authentication="name">User</div>
                        <div class="mt-1">
                            <span class="badge" style="background: var(--color-blue-subtle); color: var(--color-blue);" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                            <span class="badge" style="background: #F3F4F6; color: #0B0B0B;" sec:authorize="hasRole('STAFF')">STAFF</span>
                            <span class="badge" style="background: var(--color-green-subtle); color: var(--color-green);" sec:authorize="hasRole('CUSTOMER')">CUSTOMER</span>
                        </div>
                    </div>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm mt-2">
                    <li>
                        <div class="px-3 py-2 border-bottom">
                            <div class="fw-semibold text-dark small" sec:authentication="name">user@billora.com</div>
                            <small class="text-muted" style="font-size: 0.72rem;">Authenticated Session</small>
                        </div>
                    </li>
                    <li sec:authorize="hasRole('ADMIN')">
                        <a class="dropdown-item py-2" th:href="@{/dashboard/settings}"><i class="bi bi-sliders me-2"></i>System Settings</a>
                    </li>
                    <li><a class="dropdown-item py-2" th:href="@{/}"><i class="bi bi-box-arrow-up-right me-2"></i>Homepage</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="m-0 p-0">
                            <button type="submit" class="dropdown-item py-2 d-flex align-items-center text-dark">
                                <i class="bi bi-box-arrow-right me-2"></i>
                                <span>Sign Out</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>

            <!-- Direct Quick Logout Button on the Right -->
            <form th:action="@{/logout}" method="post" class="m-0 p-0 d-none d-sm-block">
                <button type="submit" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" title="Sign Out">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="d-none d-lg-inline">Logout</span>
                </button>
            </form>
        </div>

        <!-- Anonymous Fallback -->
        <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}" class="btn btn-primary btn-sm">Sign In</a>
        </div>
    </div>
</header>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
</body>
</html>
